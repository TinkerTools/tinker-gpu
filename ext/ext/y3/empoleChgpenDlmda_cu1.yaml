OUTPUT_DIR: src/cu/hippo
KERNEL_NAME: empoleChgpenDlmda_cu1
TEMPLATE_PARAMS: template <class Ver, class ETYP, Chgpen CP, bool CFLX>
# one copy for every box shape, imaged at run time (lambda runs only), and
# the tiles near their centers imaged once, their virial from the summed forces
LOCAL_TILES: true
# the multipole pair forces are off the line of centers
LOCAL_VIRIAL: symmetric
CONSTEXPR_FLAGS: |
  constexpr bool do_a = Ver::a;
  constexpr bool do_e = Ver::e;
  constexpr bool do_v = Ver::v;
  constexpr bool do_g = Ver::g;
  constexpr bool do_dl1 = Ver::e_dlmda1;
  constexpr bool do_dl2 = Ver::e_dlmda2;
  constexpr bool do_gdl = Ver::g_dlmda;
  constexpr bool do_vdl = Ver::v_dlmda;
  static_assert(not do_vdl or do_gdl, "");

COUNT:
  - nem
ENERGY:
  - em
ENERGY_DLMDA1:
  - demdl
ENERGY_DLMDA2:
  - d2emdl2
VIRIAL:
  - vem
VIRIAL_DLMDA:
  - demvirdl
GRADIENT:
  - gx
  - gy
  - gz
GRADIENT_DLMDA:
  - dfmdlx
  - dfmdly
  - dfmdlz

#CUT_DISTANCE:
OFF_DISTANCE: 'off'

EXCLUDE_INFO: minfo
SCALE_1X_TYPE: real3_const_array,0

EXTRA_PARAMS: |
  , real* restrict trqx, real* restrict trqy, real* restrict trqz
  , real* restrict dltrqx, real* restrict dltrqy, real* restrict dltrqz
  , real* restrict pot, real* restrict dlpot
  , const real (*restrict rpole)[10]
  , const real* restrict pcore, const real* restrict pval
  , const real* restrict pdelta, const real* restrict palpha
  , const int* restrict grp
  , real aewald, real f, GrpScale esc, GrpPairScale ps
# IMPLICIT_PARAMS:

I_VARIABLES:
  - shared real xi     from:x
  - shared real yi     from:y
  - shared real zi     from:z
  - shared real ci     from:rpole,MPL_PME_0
  - shared real dix    from:rpole,MPL_PME_X
  - shared real diy    from:rpole,MPL_PME_Y
  - shared real diz    from:rpole,MPL_PME_Z
  - shared real qixx   from:rpole,MPL_PME_XX
  - shared real qixy   from:rpole,MPL_PME_XY
  - shared real qixz   from:rpole,MPL_PME_XZ
  - shared real qiyy   from:rpole,MPL_PME_YY
  - shared real qiyz   from:rpole,MPL_PME_YZ
  - shared real qizz   from:rpole,MPL_PME_ZZ
  - shared real corei  from:pcore
  - shared real alphai from:palpha
  - shared real vali   from:pval
  - shared real dvali  from:pdelta ifset:pdelta
  - shared int gi      from:grp
K_VARIABLES:
  - shared   real xk     from:x
  - shared   real yk     from:y
  - shared   real zk     from:z
  - shared   real ck     from:rpole,MPL_PME_0
  - shared   real dkx    from:rpole,MPL_PME_X
  - shared   real dky    from:rpole,MPL_PME_Y
  - shared   real dkz    from:rpole,MPL_PME_Z
  - register real qkxx   from:rpole,MPL_PME_XX
  - register real qkxy   from:rpole,MPL_PME_XY
  - register real qkxz   from:rpole,MPL_PME_XZ
  - register real qkyy   from:rpole,MPL_PME_YY
  - register real qkyz   from:rpole,MPL_PME_YZ
  - register real qkzz   from:rpole,MPL_PME_ZZ
  - register real corek  from:pcore
  - register real alphak from:palpha
  - register real valk   from:pval
  - register real dvalk  from:pdelta ifset:pdelta
  - register int gk      from:grp
I_FORCE:
  - register real gxi  addto:gx
  - register real gyi  addto:gy
  - register real gzi  addto:gz
  - register real txi  addto:trqx
  - register real tyi  addto:trqy
  - register real tzi  addto:trqz
  - register real dltxi addto:dltrqx onlyif:do_gdl
  - register real dltyi addto:dltrqy onlyif:do_gdl
  - register real dltzi addto:dltrqz onlyif:do_gdl
  - register real poti addto:pot onlyif:(CFLX&&do_g)
  - register real dlpoti addto:dlpot onlyif:(CFLX&&do_gdl)
K_FORCE:
  - register real gxk  addto:gx
  - register real gyk  addto:gy
  - register real gzk  addto:gz
  - register real txk  addto:trqx
  - register real tyk  addto:trqy
  - register real tzk  addto:trqz
  - register real dltxk addto:dltrqx onlyif:do_gdl
  - register real dltyk addto:dltrqy onlyif:do_gdl
  - register real dltzk addto:dltrqz onlyif:do_gdl
  - register real potk addto:pot onlyif:(CFLX&&do_g)
  - register real dlpotk addto:dlpot onlyif:(CFLX&&do_gdl)
I_FORCE_DLMDA:
  - register real dgxi addto:dfmdlx
  - register real dgyi addto:dfmdly
  - register real dgzi addto:dfmdlz
K_FORCE_DLMDA:
  - register real dgxk addto:dfmdlx
  - register real dgyk addto:dfmdly
  - register real dgzk addto:dfmdlz

# The site parameters are unscaled, so is the pair, and each site's group scale
# weights it (empole4.f); the valence charge carries the unscaled flux change.
FULL_PAIRWISE_INTERACTION: |
  real xr = @xk@ - @xi@;
  real yr = @yk@ - @yi@;
  real zr = @zk@ - @zi@;
  real r2 = image2(xr, yr, zr);
  // a pair with an annihilated site has neither energy nor lambda derivative
  if (r2 <= off * off and incl and grpPairScaleLive(ps, @gi@, @gk@)) {
    real e;
    real pota, potb;
    PairMPoleGrad pgrad;
    zero(pgrad);
    real vi = @vali@ + @dvali@;
    real vk = @valk@ + @dvalk@;
    if CONSTEXPR (CP == Chgpen::GORDON1) {
    pair_mpole_chgpen<do_e, do_g, ETYP, CFLX>(
      r2, xr, yr, zr, scalea,                  //
      @ci@, @dix@, @diy@, @diz@, @corei@, vi, @alphai@, //
      @qixx@, @qixy@, @qixz@, @qiyy@, @qiyz@, @qizz@, //
      @ck@, @dkx@, @dky@, @dkz@, @corek@, vk, @alphak@, //
      @qkxx@, @qkxy@, @qkxz@, @qkyy@, @qkyz@, @qkzz@, //
      f, aewald, e, pota, potb, pgrad);
    } else if CONSTEXPR (CP == Chgpen::GORDON2) {
    pair_mpole_chgpen_aplus<do_e, do_g, ETYP, CFLX>(
      r2, xr, yr, zr, scalea,                  //
      @ci@, @dix@, @diy@, @diz@, @corei@, vi, @alphai@, //
      @qixx@, @qixy@, @qixz@, @qiyy@, @qiyz@, @qizz@, //
      @ck@, @dkx@, @dky@, @dkz@, @corek@, vk, @alphak@, //
      @qkxx@, @qkxy@, @qkxz@, @qkyy@, @qkyz@, @qkzz@, //
      f, aewald, e, pota, potb, pgrad);
    }

    real vxx, vyx, vzx, vyy, vzy, vzz;
    if CONSTEXPR (do_v and not tile_local) {
      vxx = -xr * pgrad.frcx;
      vyx = -0.5f * (yr * pgrad.frcx + xr * pgrad.frcy);
      vzx = -0.5f * (zr * pgrad.frcx + xr * pgrad.frcz);
      vyy = -yr * pgrad.frcy;
      vzy = -0.5f * (zr * pgrad.frcy + yr * pgrad.frcz);
      vzz = -zr * pgrad.frcz;
    }
    GrpPairLmda w = grpPairLmda(ps, @gi@, @gk@);
    if (grpPairLmdaActive<do_dl2>(w)) {
      pair_grpscale_dl<(do_e and do_dl1), (do_e and do_dl2)>(w, e, demdltl, d2emdl2tl);
      if CONSTEXPR (do_g) {
        if CONSTEXPR (do_gdl) {
          @dgxi@ += w.dl * pgrad.frcx;
          @dgyi@ += w.dl * pgrad.frcy;
          @dgzi@ += w.dl * pgrad.frcz;
          @dgxk@ -= w.dl * pgrad.frcx;
          @dgyk@ -= w.dl * pgrad.frcy;
          @dgzk@ -= w.dl * pgrad.frcz;
          @dltxi@ += w.dl * pgrad.ttmi[0];
          @dltyi@ += w.dl * pgrad.ttmi[1];
          @dltzi@ += w.dl * pgrad.ttmi[2];
          @dltxk@ += w.dl * pgrad.ttmk[0];
          @dltyk@ += w.dl * pgrad.ttmk[1];
          @dltzk@ += w.dl * pgrad.ttmk[2];
        }
        if CONSTEXPR (do_vdl and not tile_local) {
          demvirdltlxx += floatTo<vbuf_prec>(w.dl * vxx);
          demvirdltlyx += floatTo<vbuf_prec>(w.dl * vyx);
          demvirdltlzx += floatTo<vbuf_prec>(w.dl * vzx);
          demvirdltlyy += floatTo<vbuf_prec>(w.dl * vyy);
          demvirdltlzy += floatTo<vbuf_prec>(w.dl * vzy);
          demvirdltlzz += floatTo<vbuf_prec>(w.dl * vzz);
        }
      }
    }
    if CONSTEXPR (do_e) {
      e *= w.sc;
      emtl += floatTo<ebuf_prec>(e);
      if CONSTEXPR (do_a) {
        if (scalea != 0 and e != 0)
          nemtl += 1;
      }
    }
    if CONSTEXPR (do_g) {
      @gxi@ += w.sc * pgrad.frcx;
      @gyi@ += w.sc * pgrad.frcy;
      @gzi@ += w.sc * pgrad.frcz;
      @gxk@ -= w.sc * pgrad.frcx;
      @gyk@ -= w.sc * pgrad.frcy;
      @gzk@ -= w.sc * pgrad.frcz;

      @txi@ += w.sc * pgrad.ttmi[0];
      @tyi@ += w.sc * pgrad.ttmi[1];
      @tzi@ += w.sc * pgrad.ttmi[2];
      @txk@ += w.sc * pgrad.ttmk[0];
      @tyk@ += w.sc * pgrad.ttmk[1];
      @tzk@ += w.sc * pgrad.ttmk[2];
    }
    if CONSTEXPR (do_v and not tile_local) {
      vemtlxx += floatTo<vbuf_prec>(w.sc * vxx);
      vemtlyx += floatTo<vbuf_prec>(w.sc * vyx);
      vemtlzx += floatTo<vbuf_prec>(w.sc * vzx);
      vemtlyy += floatTo<vbuf_prec>(w.sc * vyy);
      vemtlzy += floatTo<vbuf_prec>(w.sc * vzy);
      vemtlzz += floatTo<vbuf_prec>(w.sc * vzz);
    }
    // the potential of the scaled multipoles at each site, and of their
    // lambda derivative
    if CONSTEXPR (CFLX and do_g) {
      // the site scales weight the flux potentials of the pair
      @poti@ += esc.s[@gk@] * pota;
      @potk@ += esc.s[@gi@] * potb;
      if CONSTEXPR (do_gdl) {
        @dlpoti@ += esc.ds[@gk@] * pota;
        @dlpotk@ += esc.ds[@gi@] * potb;
      }
    }
  } // end if (include)
