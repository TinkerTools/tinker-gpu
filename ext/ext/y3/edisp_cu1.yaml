OUTPUT_DIR: src/cu/hippo
KERNEL_NAME: edisp_cu1
TEMPLATE_PARAMS: template <class Ver, class DTYP>
CONSTEXPR_FLAGS: |
  constexpr bool do_a = Ver::a;
  constexpr bool do_e = Ver::e;
  constexpr bool do_v = Ver::v;
  constexpr bool do_g = Ver::g;
  constexpr bool do_dl1 = Ver::e_dlmda1;
  constexpr bool do_dl2 = Ver::e_dlmda2;
  constexpr bool do_gdl = Ver::g_dlmda;
  constexpr bool do_vdl = Ver::v_dlmda;

COUNT:
  - nd
ENERGY:
  - ed
ENERGY_DLMDA1:
  - dvdl
ENERGY_DLMDA2:
  - d2vdl2
VIRIAL:
  - vd
VIRIAL_DLMDA:
  - dvvirdl
GRADIENT:
  - gx
  - gy
  - gz
GRADIENT_DLMDA:
  - dfvdlx
  - dfvdly
  - dfvdlz

CUT_DISTANCE: cut
OFF_DISTANCE: 'off'

EXCLUDE_INFO: dinfo
SCALE_1X_TYPE: real_const_array

EXTRA_PARAMS: |
  , const real* restrict csix, const real* restrict adisp, real aewald
  , const int* restrict mut, Vdw vcouple, DispSoft ds
# IMPLICIT_PARAMS:

I_VARIABLES:
  - register real xi   from:x
  - register real yi   from:y
  - register real zi   from:z
  - register real ci   from:csix
  - register real ai   from:adisp
  - register int  imut from:mut
K_VARIABLES:
  - register real xk   from:x
  - register real yk   from:y
  - register real zk   from:z
  - register real ck   from:csix
  - register real ak   from:adisp
  - register int  kmut from:mut
I_FORCE:
  - register real gxi addto:gx
  - register real gyi addto:gy
  - register real gzi addto:gz
K_FORCE:
  - register real gxk addto:gx
  - register real gyk addto:gy
  - register real gzk addto:gz
I_FORCE_DLMDA:
  - register real dgxi addto:dfvdlx
  - register real dgyi addto:dfvdly
  - register real dgzi addto:dfvdlz
K_FORCE_DLMDA:
  - register real dgxk addto:dfvdlx
  - register real dgyk addto:dfvdly
  - register real dgzk addto:dfvdlz

SCALED_PAIRWISE_INTERACTION: |
  real xr = @xi@ - @xk@;
  real yr = @yi@ - @yk@;
  real zr = @zi@ - @zk@;
  real r2 = image2(xr, yr, zr);
  if (r2 <= off * off and incl) {
    real r = REAL_SQRT(r2);
    // the same rsqrt in every kernel version (see REAL_RSQRT_V2)
    real rr1 = REAL_RSQRT_V2(r2);
    real e, de, dle, dle2, dlde;
    bool mutik = pair_mutik(vcouple, @imut@, @kmut@);
    pair_disp<do_g, DTYP, 0, do_dl1, do_dl2, do_gdl>(r, r2, rr1,
      scalea, aewald, @ci@, @ai@, @ck@, @ak@, mutik, ds, cut, off,
      e, de, dle, dle2, dlde);
    if CONSTEXPR (do_e) {
      edtl += floatTo<ebuf_prec>(e);
      if CONSTEXPR (do_a) {
        if (scalea != 0 and e != 0)
          ndtl += 1;
      }
    }
    if CONSTEXPR (do_g) {
      real dedx, dedy, dedz;
      de *= rr1;
      dedx = de * xr;
      dedy = de * yr;
      dedz = de * zr;
      @gxi@ += dedx;
      @gyi@ += dedy;
      @gzi@ += dedz;
      @gxk@ -= dedx;
      @gyk@ -= dedy;
      @gzk@ -= dedz;
      if CONSTEXPR (do_v) {
        vdtlxx += floatTo<vbuf_prec>(xr * dedx);
        vdtlyx += floatTo<vbuf_prec>(yr * dedx);
        vdtlzx += floatTo<vbuf_prec>(zr * dedx);
        vdtlyy += floatTo<vbuf_prec>(yr * dedy);
        vdtlzy += floatTo<vbuf_prec>(zr * dedy);
        vdtlzz += floatTo<vbuf_prec>(zr * dedz);
      }
    }
    // lambda derivatives of a mutated pair (edisp1.f)
    if CONSTEXPR (do_dl1)
      dvdltl += floatTo<ebuf_prec>(dle);
    if CONSTEXPR (do_dl2)
      d2vdl2tl += floatTo<ebuf_prec>(dle2);
    if CONSTEXPR (do_gdl) {
      real dldx, dldy, dldz;
      dlde *= rr1;
      dldx = dlde * xr;
      dldy = dlde * yr;
      dldz = dlde * zr;
      @dgxi@ += dldx;
      @dgyi@ += dldy;
      @dgzi@ += dldz;
      @dgxk@ -= dldx;
      @dgyk@ -= dldy;
      @dgzk@ -= dldz;
      if CONSTEXPR (do_vdl) {
        dvvirdltlxx += floatTo<vbuf_prec>(xr * dldx);
        dvvirdltlyx += floatTo<vbuf_prec>(yr * dldx);
        dvvirdltlzx += floatTo<vbuf_prec>(zr * dldx);
        dvvirdltlyy += floatTo<vbuf_prec>(yr * dldy);
        dvvirdltlzy += floatTo<vbuf_prec>(zr * dldy);
        dvvirdltlzz += floatTo<vbuf_prec>(zr * dldz);
      }
    }
  } // end if (include)
FULL_PAIRWISE_INTERACTION: |
  real xr = @xi@ - @xk@;
  real yr = @yi@ - @yk@;
  real zr = @zi@ - @zk@;
  real r2 = image2(xr, yr, zr);
  if (r2 <= off * off and incl) {
    real r = REAL_SQRT(r2);
    // the same rsqrt in every kernel version (see REAL_RSQRT_V2)
    real rr1 = REAL_RSQRT_V2(r2);
    real e, de, dle, dle2, dlde;
    bool mutik = pair_mutik(vcouple, @imut@, @kmut@);
    pair_disp<do_g, DTYP, 1, do_dl1, do_dl2, do_gdl>(r, r2, rr1,
      1, aewald, @ci@, @ai@, @ck@, @ak@, mutik, ds, cut, off,
      e, de, dle, dle2, dlde);
    if CONSTEXPR (do_e) {
      edtl += floatTo<ebuf_prec>(e);
      if CONSTEXPR (do_a) {
        if (e != 0)
          ndtl += 1;
      }
    }
    if CONSTEXPR (do_g) {
      real dedx, dedy, dedz;
      de *= rr1;
      dedx = de * xr;
      dedy = de * yr;
      dedz = de * zr;
      @gxi@ += dedx;
      @gyi@ += dedy;
      @gzi@ += dedz;
      @gxk@ -= dedx;
      @gyk@ -= dedy;
      @gzk@ -= dedz;
      if CONSTEXPR (do_v) {
        vdtlxx += floatTo<vbuf_prec>(xr * dedx);
        vdtlyx += floatTo<vbuf_prec>(yr * dedx);
        vdtlzx += floatTo<vbuf_prec>(zr * dedx);
        vdtlyy += floatTo<vbuf_prec>(yr * dedy);
        vdtlzy += floatTo<vbuf_prec>(zr * dedy);
        vdtlzz += floatTo<vbuf_prec>(zr * dedz);
      }
    }
    // lambda derivatives of a mutated pair (edisp1.f)
    if CONSTEXPR (do_dl1)
      dvdltl += floatTo<ebuf_prec>(dle);
    if CONSTEXPR (do_dl2)
      d2vdl2tl += floatTo<ebuf_prec>(dle2);
    if CONSTEXPR (do_gdl) {
      real dldx, dldy, dldz;
      dlde *= rr1;
      dldx = dlde * xr;
      dldy = dlde * yr;
      dldz = dlde * zr;
      @dgxi@ += dldx;
      @dgyi@ += dldy;
      @dgzi@ += dldz;
      @dgxk@ -= dldx;
      @dgyk@ -= dldy;
      @dgzk@ -= dldz;
      if CONSTEXPR (do_vdl) {
        dvvirdltlxx += floatTo<vbuf_prec>(xr * dldx);
        dvvirdltlyx += floatTo<vbuf_prec>(yr * dldx);
        dvvirdltlzx += floatTo<vbuf_prec>(zr * dldx);
        dvvirdltlyy += floatTo<vbuf_prec>(yr * dldy);
        dvvirdltlzy += floatTo<vbuf_prec>(zr * dldy);
        dvvirdltlzz += floatTo<vbuf_prec>(zr * dldz);
      }
    }
  } // end if (include)
