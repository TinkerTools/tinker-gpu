OUTPUT_DIR: src/cu/hippo
KERNEL_NAME: echgtrn_cu1
TEMPLATE_PARAMS: template <class Ver, Chgtrn CT>
CONSTEXPR_FLAGS: |
  constexpr bool do_a = Ver::a;
  constexpr bool do_e = Ver::e;
  constexpr bool do_v = Ver::v;
  constexpr bool do_g = Ver::g;
  constexpr bool do_dl1 = Ver::e_dlmda1;
  constexpr bool do_dl2 = Ver::e_dlmda2;
  constexpr bool do_gdl = Ver::g_dlmda;
  constexpr bool do_vdl = Ver::v_dlmda;

COUNT:
  - nc
ENERGY:
  - ec
ENERGY_DLMDA1:
  - dcdl
ENERGY_DLMDA2:
  - d2cdl2
VIRIAL:
  - vc
VIRIAL_DLMDA:
  - dvcdl
GRADIENT:
  - gx
  - gy
  - gz
GRADIENT_DLMDA:
  - gxdl
  - gydl
  - gzdl

CUT_DISTANCE: cut
OFF_DISTANCE: 'off'

EXCLUDE_INFO: minfo
SCALE_1X_TYPE: real3_const_array,0

EXTRA_PARAMS: |
  , real *restrict chgct
  , real *restrict dmpct
  , real f
  , const int* restrict grp
  , GrpPairScale ctsc
# IMPLICIT_PARAMS:

I_VARIABLES:
  - register real xi     from:x
  - register real yi     from:y
  - register real zi     from:z
  - register real chgi   from:chgct
  - register real alphai from:dmpct
  - register int  igrp   from:grp
K_VARIABLES:
  - register real xk     from:x
  - register real yk     from:y
  - register real zk     from:z
  - register real chgk   from:chgct
  - register real alphak from:dmpct
  - register int  kgrp   from:grp
I_FORCE:
  - register real gxi addto:gx
  - register real gyi addto:gy
  - register real gzi addto:gz
K_FORCE:
  - register real gxk addto:gx
  - register real gyk addto:gy
  - register real gzk addto:gz
I_FORCE_DLMDA:
  - register real dgxi addto:gxdl
  - register real dgyi addto:gydl
  - register real dgzi addto:gzdl
K_FORCE_DLMDA:
  - register real dgxk addto:gxdl
  - register real dgyk addto:gydl
  - register real dgzk addto:gzdl

# Each pair takes the scale of its group pair, and the lambda derivatives come
# from the pair before that scale (echgtrn1.f, dlambda.f:ctlmdasc).
SCALED_PAIRWISE_INTERACTION: |
  real xr = @xk@ - @xi@;
  real yr = @yk@ - @yi@;
  real zr = @zk@ - @zi@;
  real r2 = image2(xr, yr, zr);
  int ik = 3 * @igrp@ + @kgrp@;
  if (r2 <= off * off and incl and (ctsc.live >> ik & 1)) {
    real r = REAL_SQRT(r2);
    e_prec e, de;
    if CONSTEXPR (CT == Chgtrn::SEPARATE)
      pair_chgtrn<do_g>      (r, cut, off, scalea, f, @alphai@, @chgi@, @alphak@, @chgk@, 1, e, de);
    else if CONSTEXPR (CT == Chgtrn::COMBINED)
      pair_chgtrn_aplus<do_g>(r, cut, off, scalea, f, @alphai@, @chgi@, @alphak@, @chgk@, 1, e, de);
    if CONSTEXPR (do_dl1)
      dcdltl += floatTo<ebuf_prec>(ctsc.dl[@igrp@][@kgrp@] * e);
    if CONSTEXPR (do_dl2)
      d2cdl2tl += floatTo<ebuf_prec>(ctsc.d2l[@igrp@][@kgrp@] * e);
    if CONSTEXPR (do_gdl or do_vdl) {
      real dlde = ctsc.dl[@igrp@][@kgrp@] * de * REAL_RECIP(r);
      real dldedx = dlde * xr;
      real dldedy = dlde * yr;
      real dldedz = dlde * zr;
      if CONSTEXPR (do_gdl) {
        @dgxi@ -= dldedx;
        @dgyi@ -= dldedy;
        @dgzi@ -= dldedz;
        @dgxk@ += dldedx;
        @dgyk@ += dldedy;
        @dgzk@ += dldedz;
      }
      if CONSTEXPR (do_vdl) {
        dvcdltlxx += floatTo<vbuf_prec>(xr * dldedx);
        dvcdltlyx += floatTo<vbuf_prec>(yr * dldedx);
        dvcdltlzx += floatTo<vbuf_prec>(zr * dldedx);
        dvcdltlyy += floatTo<vbuf_prec>(yr * dldedy);
        dvcdltlzy += floatTo<vbuf_prec>(zr * dldedy);
        dvcdltlzz += floatTo<vbuf_prec>(zr * dldedz);
      }
    }
    real sc = ctsc.sc[@igrp@][@kgrp@];
    e *= sc;
    de *= sc;
    if CONSTEXPR (do_a)
        if (e != 0 and scalea != 0)
          nctl += 1;
    if CONSTEXPR (do_e)
        ectl += floatTo<ebuf_prec>(e);
    if CONSTEXPR (do_g) {
      de *= REAL_RECIP(r);
      real dedx = de * xr;
      real dedy = de * yr;
      real dedz = de * zr;

      @gxi@ -= dedx;
      @gyi@ -= dedy;
      @gzi@ -= dedz;
      @gxk@ += dedx;
      @gyk@ += dedy;
      @gzk@ += dedz;

      if CONSTEXPR (do_v) {
        vctlxx += floatTo<vbuf_prec>(xr * dedx);
        vctlyx += floatTo<vbuf_prec>(yr * dedx);
        vctlzx += floatTo<vbuf_prec>(zr * dedx);
        vctlyy += floatTo<vbuf_prec>(yr * dedy);
        vctlzy += floatTo<vbuf_prec>(zr * dedy);
        vctlzz += floatTo<vbuf_prec>(zr * dedz);
      }
    }
  } // end if (include)
FULL_PAIRWISE_INTERACTION: |
  real xr = @xk@ - @xi@;
  real yr = @yk@ - @yi@;
  real zr = @zk@ - @zi@;
  real r2 = image2(xr, yr, zr);
  int ik = 3 * @igrp@ + @kgrp@;
  if (r2 <= off * off and incl and (ctsc.live >> ik & 1)) {
    real r = REAL_SQRT(r2);
    e_prec e, de;
    if CONSTEXPR (CT == Chgtrn::SEPARATE)
      pair_chgtrn<do_g>      (r, cut, off, 1, f, @alphai@, @chgi@, @alphak@, @chgk@, 1, e, de);
    else if CONSTEXPR (CT == Chgtrn::COMBINED)
      pair_chgtrn_aplus<do_g>(r, cut, off, 1, f, @alphai@, @chgi@, @alphak@, @chgk@, 1, e, de);
    if CONSTEXPR (do_dl1)
      dcdltl += floatTo<ebuf_prec>(ctsc.dl[@igrp@][@kgrp@] * e);
    if CONSTEXPR (do_dl2)
      d2cdl2tl += floatTo<ebuf_prec>(ctsc.d2l[@igrp@][@kgrp@] * e);
    if CONSTEXPR (do_gdl or do_vdl) {
      real dlde = ctsc.dl[@igrp@][@kgrp@] * de * REAL_RECIP(r);
      real dldedx = dlde * xr;
      real dldedy = dlde * yr;
      real dldedz = dlde * zr;
      if CONSTEXPR (do_gdl) {
        @dgxi@ -= dldedx;
        @dgyi@ -= dldedy;
        @dgzi@ -= dldedz;
        @dgxk@ += dldedx;
        @dgyk@ += dldedy;
        @dgzk@ += dldedz;
      }
      if CONSTEXPR (do_vdl) {
        dvcdltlxx += floatTo<vbuf_prec>(xr * dldedx);
        dvcdltlyx += floatTo<vbuf_prec>(yr * dldedx);
        dvcdltlzx += floatTo<vbuf_prec>(zr * dldedx);
        dvcdltlyy += floatTo<vbuf_prec>(yr * dldedy);
        dvcdltlzy += floatTo<vbuf_prec>(zr * dldedy);
        dvcdltlzz += floatTo<vbuf_prec>(zr * dldedz);
      }
    }
    real sc = ctsc.sc[@igrp@][@kgrp@];
    e *= sc;
    de *= sc;
    if CONSTEXPR (do_a)
        if (e != 0)
          nctl += 1;
    if CONSTEXPR (do_e)
        ectl += floatTo<ebuf_prec>(e);
    if CONSTEXPR (do_g) {
      de *= REAL_RECIP(r);
      real dedx = de * xr;
      real dedy = de * yr;
      real dedz = de * zr;

      @gxi@ -= dedx;
      @gyi@ -= dedy;
      @gzi@ -= dedz;
      @gxk@ += dedx;
      @gyk@ += dedy;
      @gzk@ += dedz;

      if CONSTEXPR (do_v) {
        vctlxx += floatTo<vbuf_prec>(xr * dedx);
        vctlyx += floatTo<vbuf_prec>(yr * dedx);
        vctlzx += floatTo<vbuf_prec>(zr * dedx);
        vctlyy += floatTo<vbuf_prec>(yr * dedy);
        vctlzy += floatTo<vbuf_prec>(zr * dedy);
        vctlzz += floatTo<vbuf_prec>(zr * dedz);
      }
    }
  } // end if (include)
